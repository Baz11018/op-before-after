function render(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];let r=report(),html='';switch(view.screen){case 'home':html=`<div class="top"><div class="grad"><h1>OP Before & After</h1><p>Photo reports, made simple.</p></div></div><div class="wrap">${state.reports.map(x=>`<div class="card" style="position:relative" onclick="openReport('${x.id}')"><div class="title" style="padding-right:85px">${esc(x.title)}</div><div class="small">${fmt(x.date)} · ${x.sections.length} sections</div><button class="btn secondary" aria-label="Rename report" style="position:absolute;right:54px;top:10px;padding:5px 9px" onclick="event.stopPropagation();renameReport('${x.id}')">✎</button><button class="btn danger" aria-label="Delete report" style="position:absolute;right:10px;top:10px;padding:5px 10px" onclick="event.stopPropagation();removeReport('${x.id}')">×</button></div>`).join('')||'<div class="card small">No reports yet.</div>'}<button class="btn primary block" onclick="go('new')">＋ New Report</button></div>${tabs()}`;break;

async function hydrate(){for(let el of document.querySelectorAll('[data-ids]')){for(let id of el.dataset.ids.split(',').filter(Boolean)){let u=await photoUrl(id);if(!u)continue;urls.push(u);let im=document.createElement('img');im.src=u;im.onclick=()=>openPhoto(id);el.appendChild(im)}}if(view.screen==='edit'){await fillGrid('before');await fillGrid('after')}if(view.screen==='pdf')renderPdfPreview()}

async function createReport(){let title=$('#rt').value.trim();if(!title)return alertToast('Enter a report title');let r={id:uid(),title,date:$('#rd').value||today(),sections:[]};state.reports.unshift(r);await save();openReport(r.id)}function openReport(id){view.reportId=id;view.screen='report';render()}async function renameReport(id){let r=state.reports.find(x=>x.id===id);if(!r)return;let name=prompt('Report name',r.title);if(!name?.trim()||name.trim()===r.title)return;r.title=name.trim();await save();render()}async function removeReport(id){let r=state.reports.find(x=>x.id===id);if(!r||!confirm(`Delete ${r.title}?`))return;for(let id of ids(r))await del('photos',id);state.reports=state.reports.filter(x=>x.id!==r.id);await save();render()}

async function cancelEdit(){for(let id of added)await del('photos',id);added=[];draft=null;view.screen='report';render()}async function saveSection(){syncTitle();draft.title=draft.title.trim();if(!draft.title)return alertToast('Enter a section title');if(!draft.before.length&&!draft.after.length)return alertToast('Add at least one photo');let old=draft.fresh?[]:[...section().before,...section().after];let next=[...draft.before,...draft.after];for(let id of old)if(!next.includes(id))await del('photos',id);for(let id of added)if(!next.includes(id))await del('photos',id);let fresh=draft.fresh;delete draft.fresh;if(fresh)report().sections.push(draft);else Object.assign(section(),draft);await save();added=[];draft=null;view.screen='report';render()}

   let totalHeight=headingHeight+contentHeight+12,firstHeight=paired?27+pairHeight+12:groups.length?27+groups[0].rows[0].h+12:0;
   // Keep the entire section together when possible. For long sections, keep the title with the first photo row.

   if(y-reserve<BOTTOM)await nextPage();
   page.drawRectangle({x:L,y:y-19*lines.length-6,width:W,height:19*lines.length+6,color:rgb(.94,.95,.97)});

   }else for(let group of groups){

  }
  let bytes=await doc.save(),blob=new Blob([bytes],{type:'application/pdf'}),name=(r.title+' - Before and After.pdf').replace(/[\\/:*?"<>|]/g,'-');pdfFile={bytes:new Uint8Array(bytes),blob,name,file:new File([blob],name,{type:'application/pdf'})};r.lastPdfAt=stamp();r.lastPdfBytes=blob.size;await save();view.screen='pdf';render();
 }catch(e){console.error(e);alert('Could not create the PDF. Please check the template and photos.')}
}
async function renderPdfPreview(){let box=$('#pdfPreview');if(!box||!pdfFile)return;try{if(!window.pdfjsLib)throw Error('Preview library unavailable');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:pdfFile.bytes.slice()}).promise;box.innerHTML='';for(let i=1;i<=doc.numPages;i++){let page=await doc.getPage(i),base=page.getViewport({scale:1}),scale=Math.min(2,Math.max(1,(box.clientWidth||360)*2/base.width)),vp=page.getViewport({scale}),canvas=document.createElement('canvas');canvas.className='pdfPage';canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;box.appendChild(canvas)}}catch(e){console.error(e);box.innerHTML='<div class="small">PDF preview unavailable. You can still share the file.</div>'}}
function downloadPdf(){if(!pdfFile)return;let url=URL.createObjectURL(pdfFile.blob),a=document.createElement('a');a.href=url;a.download=pdfFile.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}async function sharePdf(){if(!pdfFile)return;if(navigator.canShare?.({files:[pdfFile.file]})){try{await navigator.share({files:[pdfFile.file],title:pdfFile.name});return}catch(e){if(e.name==='AbortError')return}}downloadPdf()}
async function saveZip(zip,name){let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),file=new File([blob],name,{type:'application/zip'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return blob.size}catch(e){if(e.name==='AbortError')return null}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);return blob.size}
async function addZipPhotos(zip,photoIds){for(let id of photoIds){let p=await get('photos',id);if(p){zip.file(`photos/${id}.jpg`,p.blob);zip.file(`photos/${id}-thumb.jpg`,p.thumb)}}}
async function backupReport(){if(!window.JSZip)return alert('Backup library unavailable.');let r=report(),zip=new JSZip();zip.file('backup.json',JSON.stringify({type:'op-before-after-report',version:1,report:r,createdAt:stamp()}));await addZipPhotos(zip,ids(r));let size=await saveZip(zip,(r.title+' - OP Before After Backup.zip').replace(/[\\/:*?"<>|]/g,'-'));if(size){r.lastBackupAt=stamp();r.lastBackupBytes=size;await save();alertToast('Backup saved')}}
async function backupAll(){if(!window.JSZip)return alert('Backup library unavailable.');let zip=new JSZip(),copy=structuredClone(state);copy.templateBytes=null;zip.file('backup.json',JSON.stringify({type:'op-before-after-full',version:1,state:copy,createdAt:stamp()}));await addZipPhotos(zip,[...new Set(state.reports.flatMap(ids))]);if(state.templateBytes)zip.file('template.pdf',new Uint8Array(state.templateBytes));let size=await saveZip(zip,`OP Before After - Full Backup - ${today()}.zip`);if(size){state.lastBackupAt=stamp();await save();alertToast('Backup saved')}}
async function restoreFile(file){if(!file)return;try{let zip=await JSZip.loadAsync(file),entry=zip.file('backup.json');if(!entry)throw Error('Invalid backup');let data=JSON.parse(await entry.async('string'));if(data.type==='op-before-after-report'){let r=structuredClone(data.report);if(!Array.isArray(r.sections))throw Error('Invalid report');let map={};for(let s of r.sections){s.id=uid();for(let key of ['before','after']){let arr=[];for(let old of s[key]||[]){if(!map[old]){let f=zip.file(`photos/${old}.jpg`),t=zip.file(`photos/${old}-thumb.jpg`);if(!f)throw Error('Missing photo');let blob=await f.async('blob'),thumb=t?await t.async('blob'):blob,id=uid();await put('photos',id,{blob,thumb});map[old]=id}arr.push(map[old])}s[key]=arr}}r.id=uid();r.title+=state.reports.some(x=>x.title===r.title)?' (Restored)':'';state.reports.unshift(r);await save();openReport(r.id)}else if(data.type==='op-before-after-full'){if(!confirm('Replace all reports on this device with this backup?'))return;let ns=data.state;if(!Array.isArray(ns?.reports))throw Error('Invalid state');let records=[];for(let path of Object.keys(zip.files).filter(p=>/^photos\/[^/]+\.jpg$/.test(p)&&!p.endsWith('-thumb.jpg'))){let id=path.slice(7,-4),blob=await zip.file(path).async('blob'),thumb=zip.file(`photos/${id}-thumb.jpg`)?await zip.file(`photos/${id}-thumb.jpg`).async('blob'):blob;records.push({id,blob,thumb})}let template=zip.file('template.pdf');ns.templateBytes=template?await template.async('arraybuffer'):null;await clear('photos');for(let rec of records)await put('photos',rec.id,{blob:rec.blob,thumb:rec.thumb});state=ns;await save();home();alertToast('Backup restored')}else throw Error('Unknown backup type')}catch(e){console.error(e);alert('Could not restore this backup.')}}
(async()=>{try{await openDb();state=await get('meta','state')||state;render()}catch(e){console.error(e);$('#app').innerHTML='<div class="wrap"><div class="card">Unable to load the app. Close and reopen it.</div></div>'}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'})})();
